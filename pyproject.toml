[project]
name = "univenrag-e"
version = "0.1.0"
description = "Plateforme du collectif : POC d'agenda alimenté par des propositions extérieures"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-otp>=1.5",
    "icalendar>=6.0",
    "segno>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM"]
